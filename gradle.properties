# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ is not yet fully compatible with the configuration cache (Loom issue #1349).
org.gradle.configuration-cache=false

# Minecraft 26.x requires Java 25, and Loom demands that Gradle itself runs on it (a toolchain is
# not enough). Point your IDE's Gradle JVM at a JDK 25, or set org.gradle.java.home in
# ~/.gradle/gradle.properties - not here, it is an absolute path of one machine.

# Fabric Properties (https://fabricmc.net/develop)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=0.1.0
maven_group=net.kasax.bobbot
archives_base_name=bobbot

# Dependencies
fabric_version=0.161.0+26.3
